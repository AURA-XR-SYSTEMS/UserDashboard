<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA — Sign in</title>
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1517" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="default.css">
<script>document.documentElement.classList.add("js");try{var t=localStorage.getItem("aura-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top" data-top>
  <a class="brand" href="index.html" aria-label="AURA, sign in">
    <svg viewBox="0 0 100 68" aria-hidden="true"><defs><clipPath id="mk-l"><circle cx="34" cy="34" r="34"/></clipPath><clipPath id="mk-r"><circle cx="66" cy="34" r="34"/></clipPath></defs><circle cx="66" cy="34" r="34" fill="var(--signal-fill)"/><circle cx="34" cy="34" r="34" fill="currentColor"/><g clip-path="url(#mk-l)"><rect x="0" y="0" width="50" height="68" fill="var(--signal-fill)" clip-path="url(#mk-r)"/></g></svg>
    <span>AURA</span>
  </a>
  <nav aria-label="Main" data-nav></nav>
  <div class="right">
    <button class="theme" type="button" data-theme-toggle aria-label="Switch colour theme">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.8a8.2 8.2 0 0 1 0 16.4z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main id="main" class="container">
  <div class="auth-wrap">
    <section class="hero">
      <h1 data-lidar>Sign in.</h1>
      <p>One account for AURA ENGINE and Ask AURA.</p>
    </section>

    <div class="auth">
      <div class="tabs">
        <div class="tab-header" role="tablist">
          <button class="tab-btn active" type="button" data-tab-target="#tab-login">Sign in</button>
          <button class="tab-btn" type="button" data-tab-target="#tab-register">Create account</button>
        </div>
        <div class="tab-panels">
          <div class="tab-panel active" id="tab-login">
            <form class="form" method="post" data-auth-form data-mode="login">
              <div class="form-error" data-auth-error hidden role="alert" aria-live="polite"></div>
              <div>
                <label for="login-email">Email</label>
                <input class="input" id="login-email" type="email" name="email" required autocomplete="email" placeholder="you@company.com">
              </div>
              <div>
                <label for="login-password">Password</label>
                <input class="input" id="login-password" type="password" name="password" required minlength="6" autocomplete="current-password">
                <p class="small"><a href="forgot-password.html">Forgot your password?</a></p>
              </div>
              <div class="row">
                <button class="btn primary cta" type="submit">Sign in</button>
              </div>
            </form>
          </div>
          <div class="tab-panel" id="tab-register">
            <form class="form" method="post" data-auth-form data-mode="register">
              <div class="form-error" data-auth-error hidden role="alert" aria-live="polite"></div>
              <div>
                <label for="reg-first">First name</label>
                <input class="input" id="reg-first" type="text" name="first_name" autocomplete="given-name">
              </div>
              <div>
                <label for="reg-last">Last name</label>
                <input class="input" id="reg-last" type="text" name="last_name" autocomplete="family-name">
              </div>
              <div>
                <label for="reg-email">Email</label>
                <input class="input" id="reg-email" type="email" name="email" required autocomplete="email" placeholder="you@company.com">
              </div>
              <div>
                <label for="reg-password">Password</label>
                <input class="input" id="reg-password" type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
              </div>
              <div class="row">
                <button class="btn primary cta" type="submit">Create account</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="foot__mark" aria-hidden="true" data-fit><span data-line>AURA</span><span data-line>ENGINE</span></div>
  <div class="foot__row">
    <ul>
      <li><a href="#" data-legal-view="terms">Terms</a></li>
      <li><a href="#" data-legal-view="privacy">Privacy</a></li>
      <li><a href="mailto:support@auraengine.com">support@auraengine.com</a></li>
    </ul>
    <p>© 2026 Aura XR Systems LLC</p>
  </div>
</footer>
<script type="module" src="/src/main.js"></script>
</body>
</html>
